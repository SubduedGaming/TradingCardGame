name: Windows installer

# Builds "Front-Line-Server-Setup-<version>.exe". Run it from the Actions tab ("Run workflow"),
# or push a tag like v0.1.0 to also publish it as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --exclude src/ai/balance.report.test.ts
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: front-line-server-installer
          path: release/Front-Line-Server-Setup-*.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/Front-Line-Server-Setup-*.exe
